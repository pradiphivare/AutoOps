groups:
  - name: autoops_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: cpu_usage_percent > 90
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "High CPU usage detected on {{ $labels.service }}"
          description: "CPU usage is {{ $value }}% on service {{ $labels.service }}"

      - alert: HighMemoryUsage
        expr: memory_usage_percent > 90
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "High memory usage detected on {{ $labels.service }}"
          description: "Memory usage is {{ $value }}% on service {{ $labels.service }}"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          component: availability
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute"

      - alert: AnomalyDetected
        expr: anomaly_score < -0.5
        for: 1m
        labels:
          severity: warning
          component: anomaly_detection
        annotations:
          summary: "Anomaly detected on {{ $labels.service }}"
          description: "Anomaly score is {{ $value }} for {{ $labels.metric_type }} on {{ $labels.service }}"

      - alert: HighDiskUsage
        expr: disk_usage_percent > 85
        for: 5m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High disk usage on {{ $labels.service }}"
          description: "Disk usage is {{ $value }}% on service {{ $labels.service }}"
